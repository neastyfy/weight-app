<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover — на iPhone приложение занимает весь экран (вырез и полоска Home учитываются отступами);
         maximum-scale=1 — iOS не увеличивает страницу при вводе в поле -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>WeightApp</title>
    <meta name="description" content="Трекер веса и прогресса к цели. Данные хранятся только на устройстве." />

    <!-- PWA: установка на экран «Домой» -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WeightApp" />
    <!-- black-translucent: приложение рисуется под чёлкой и строкой состояния (отступы даёт safe area);
         текст строки состояния при этом всегда белый -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FCFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101A30" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* цвет фона до загрузки приложения — без белой вспышки */
        background-color: #fcfaf8;
        /* без серой подсветки при касании на iPhone */
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #101a30;
        }
      }
      /* PWA на iPhone (status-bar-style black-translucent): страница начинается под строкой состояния,
         но её высота (100%) короче экрана на высоту этой строки — снизу оставалась полоса,
         и панель вкладок поднималась. Добавляем недостающую высоту. Только в установленном приложении. */
      @media (display-mode: standalone) {
        html {
          height: calc(100% + env(safe-area-inset-top));
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- Офлайн-работа (public/sw.js). Только на настоящем сайте — не на localhost,
         чтобы service worker не кешировал сборки разработки. -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
